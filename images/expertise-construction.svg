<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="constGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect width="400" height="300" fill="url(#constGrad)"/>
  
  <g filter="url(#shadow)">
    <rect x="50" y="170" width="300" height="30" fill="#8b7355"/>
    <rect x="80" y="90" width="240" height="80" fill="#ecf0f1" stroke="#34495e" stroke-width="2"/>
    
    <rect x="100" y="105" width="25" height="25" fill="#3498db"/>
    <rect x="150" y="105" width="25" height="25" fill="#3498db"/>
    <rect x="200" y="105" width="25" height="25" fill="#3498db"/>
    <rect x="250" y="105" width="25" height="25" fill="#3498db"/>
    
    <rect x="100" y="145" width="25" height="25" fill="#3498db"/>
    <rect x="150" y="145" width="25" height="25" fill="#3498db"/>
    <rect x="200" y="145" width="25" height="25" fill="#3498db"/>
    <rect x="250" y="145" width="25" height="25" fill="#3498db"/>
  </g>
  
  <polygon points="80,90 200,30 320,90" fill="#e74c3c"/>
  <g transform="translate(320, 190)">
    <rect x="0" y="0" width="8" height="40" fill="#95a5a6"/>
    <polygon points="4,40 0,50 8,50" fill="#e74c3c"/>
  </g>
  
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Construction</text>
</svg>