<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#34495e" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.8" numOctaves="1" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend mode="overlay"/>
    </filter>
  </defs>
  
  <rect width="1200" height="600" fill="url(#heroGrad)"/>
  
  <g transform="translate(150,120)">
    <rect x="0" y="0" width="300" height="220" rx="10" fill="#ecf0f1" opacity="0.95"/>
    <text x="150" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">CEBIG SARL</text>
    <text x="150" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Construction • Rénovation • Hydraulique</text>
    <rect x="100" y="120" width="100" height="40" rx="6" fill="#3498db"/>
    <text x="150" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Contactez-nous</text>
  </g>
  
  <g transform="translate(500,80)">
    <rect x="0" y="0" width="600" height="180" rx="12" fill="#ffffff" opacity="0.03"/>
    <g>
      <rect x="20" y="30" width="80" height="80" rx="6" fill="#e74c3c"/>
      <rect x="120" y="30" width="80" height="80" rx="6" fill="#f39c12"/>
      <rect x="220" y="30" width="80" height="80" rx="6" fill="#3498db"/>
      <rect x="320" y="30" width="80" height="80" rx="6" fill="#2ecc71"/>
    </g>
  </g>
  
  <text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ecf0f1">Expertise locale, réalisations durables</text>
</svg>