<svg width="500" height="400" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond -->
  <rect width="500" height="400" fill="url(#bgGrad)"/>
  
  <!-- Ciel avec nuages -->
  <ellipse cx="100" cy="80" rx="60" ry="40" fill="#ecf0f1" opacity="0.7"/>
  <ellipse cx="140" cy="70" rx="80" ry="35" fill="#ecf0f1" opacity="0.6"/>
  <ellipse cx="400" cy="120" rx="70" ry="38" fill="#ecf0f1" opacity="0.5"/>
  
  <!-- Bâtiment principal -->
  <rect x="150" y="120" width="200" height="220" fill="url(#buildingGrad)" stroke="#34495e" stroke-width="2"/>
  
  <!-- Fenêtres rangée 1 -->
  <rect x="170" y="140" width="25" height="25" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
  <rect x="215" y="140" width="25" height="25" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
  <rect x="260" y="140" width="25" height="25" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
  <rect x="305" y="140" width="25" height="25" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
  
  <!-- Fenêtres rangée 2 -->
  <rect x="170" y="185" width="25" height="25" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
  <rect x="215" y="185" width="25" height="25" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
  <rect x="260" y="185" width="25" height="25" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
  <rect x="305" y="185" width="25" height="25" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
  
  <!-- Fenêtres rangée 3 -->
  <rect x="170" y="230" width="25" height="25" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
  <rect x="215" y="230" width="25" height="25" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
  <rect x="260" y="230" width="25" height="25" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
  <rect x="305" y="230" width="25" height="25" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
  
  <!-- Porte -->
  <rect x="215" y="280" width="70" height="60" fill="#8b4513" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="278" cy="310" r="4" fill="#f1c40f"/>
  
  <!-- Toit -->
  <polygon points="150,120 250,40 350,120" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  
  <!-- Petite structure adjacente -->
  <rect x="80" y="220" width="60" height="120" fill="#95a5a6" stroke="#34495e" stroke-width="2"/>
  
  <!-- Fenêtres petite structure -->
  <rect x="92" y="240" width="18" height="18" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
  <rect x="118" y="240" width="18" height="18" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
  <rect x="92" y="280" width="18" height="18" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
  <rect x="118" y="280" width="18" height="18" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
  
  <!-- Drapeau/bannière au sommet -->
  <rect x="245" y="25" width="10" height="25" fill="#34495e"/>
  <polygon points="255,30 255,45 275,37.5" fill="#27ae60"/>
  
  <!-- Équipements -->
  <rect x="360" y="180" width="30" height="80" fill="#95a5a6" stroke="#34495e" stroke-width="1.5"/>
  
  <!-- Zone piétonne/route -->
  <ellipse cx="250" cy="360" rx="150" ry="30" fill="#34495e" opacity="0.3"/>
  <line x1="100" y1="360" x2="400" y2="360" stroke="#f39c12" stroke-width="2" stroke-dasharray="10,10"/>
</svg>
